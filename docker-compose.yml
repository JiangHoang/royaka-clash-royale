version: '3'
services:
  backend:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LEGACY_SESSION_CUTOFF: ${LEGACY_SESSION_CUTOFF}

  frontend:
    build:
      context: ./client
      args:
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    ports:
      - "5173:80"
